<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="author" content="Nguyentoanqh" />
    <meta name="copyright" content="Nguyentoanqh" />
    <title>Phân công chuyên môn</title>
    <meta name="description" content="Hệ thống quản lý phân công chuyên môn, định mức tiết dạy, kiểm tra lỗi và lập báo cáo - Copyright Nguyentoanqh" />
    <meta property="og:title" content="Phân công chuyên môn" />
    <meta property="og:description" content="Hệ thống quản lý phân công chuyên môn, định mức tiết dạy, kiểm tra lỗi và lập báo cáo - Copyright Nguyentoanqh" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PCCM THCS" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
      // 1. Tự động dọn sạch Service Worker cũ & CacheStorage nếu đang chạy trong môi trường Dev / Preview Cloud Run / localhost
      (function() {
        try {
          var isDevOrPreview = window.location.hostname.includes('run.app') ||
                               window.location.hostname.includes('localhost') ||
                               window.location.hostname.includes('127.0.0.1') ||
                               window.location.hostname.includes('google.com');
          if (isDevOrPreview && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if (isDevOrPreview && 'caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            }).catch(function() {});
          }
        } catch (e) {}

        // 2. Chặn lỗi HMR WebSocket khi dev server tắt HMR theo environment constraints
        var oldOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var str = String(message || '') + String(source || '') + String(error || '');
          if (str.indexOf('send') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1) {
            return true;
          }
          if (typeof oldOnError === 'function') {
            return oldOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event.reason && (event.reason.message || String(event.reason));
          if (msg && (msg.indexOf('send') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (msg && (msg.indexOf('send') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root">
      <!-- Màn hình chờ trực quan ban đầu, chống trắng màn hình khi tải trang (F5) -->
      <div id="initial-app-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1e293b; padding: 24px; text-align: center;">
        <div style="width: 52px; height: 52px; border: 4px solid #1e3a8a; border-top-color: transparent; border-radius: 50%; animation: pccm-spin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 18px; font-weight: 700; color: #1e3a8a; margin: 0 0 8px 0; letter-spacing: -0.01em;">
          PHÂN CÔNG CHUYÊN MÔN
        </h2>
        <p style="font-size: 13px; font-weight: 500; color: #64748b; margin: 0 0 24px 0; max-width: 380px; line-height: 1.5;">
          Đang khởi động hệ thống và nạp dữ liệu trường học...
        </p>
        <button id="pccm-force-reload-btn" type="button" onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="display: none; padding: 10px 20px; background-color: #1e3a8a; color: #ffffff; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);">
          Làm mới phiên làm việc
        </button>
        <script>
          // Nếu sau 4.5 giây mà React chưa mount vào #root, hiển thị nút làm mới
          setTimeout(function() {
            var btn = document.getElementById('pccm-force-reload-btn');
            if (btn) btn.style.display = 'inline-block';
          }, 4500);
        </script>
        <style>
          @keyframes pccm-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
