    <script>
      // Safe WebSocket patch for Vite client when running in iframe/proxy preview environments
      (function() {
        try {
          var dummySocket = {
            send: function() {},
            close: function() {},
            addEventListener: function() {},
            removeEventListener: function() {},
            readyState: 1
          };
          var OriginalWebSocket = window.WebSocket;
          var PatchedWebSocket = function(url, protocols) {
            try {
              if (!OriginalWebSocket) return dummySocket;
              var ws = protocols !== undefined ? new OriginalWebSocket(url, protocols) : new OriginalWebSocket(url);
              var origSend = ws.send;
              ws.send = function(data) {
                try {
                  if (ws && ws.readyState === 1 && typeof origSend === 'function') {
                    origSend.call(ws, data);
                  }
                } catch (err) {}
              };
              return ws;
            } catch (e) {
              return dummySocket;
            }
          };
          if (OriginalWebSocket) {
            PatchedWebSocket.prototype = OriginalWebSocket.prototype;
          }
          PatchedWebSocket.CONNECTING = 0;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CLOSED = 3;
          window.WebSocket = PatchedWebSocket;
        } catch (e) {}

        // Global onerror handler to suppress disabled Vite HMR/WebSocket errors per environment constraints
        var oldOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var str = String(message || '') + String(source || '') + String(error || '');
          if (str.indexOf('send') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1) {
            return true; // suppresses error
          }
          if (typeof oldOnError === 'function') {
            return oldOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event.reason && (event.reason.message || String(event.reason));
          if (msg && (msg.indexOf('send') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (msg && (msg.indexOf('send') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
