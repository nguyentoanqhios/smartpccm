<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="author" content="Nguyentoanqh" />
    <meta name="copyright" content="Nguyentoanqh" />
    <title>Phân công chuyên môn</title>
    <meta name="description" content="Hệ thống quản lý phân công chuyên môn, định mức tiết dạy, kiểm tra lỗi và lập báo cáo - Copyright Nguyentoanqh" />
    <meta property="og:title" content="Phân công chuyên môn" />
    <meta property="og:description" content="Hệ thống quản lý phân công chuyên môn, định mức tiết dạy, kiểm tra lỗi và lập báo cáo - Copyright Nguyentoanqh" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PCCM THCS" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
      // 1. Tự động hủy đăng ký toàn bộ Service Worker và dọn sạch CacheStorage trên MỌI môi trường
      // Ngăn chặn 100% sự cố trình duyệt lưu đệm file JS/HTML cũ dẫn đến lỗi tải trang
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            }).catch(function() {});
          }
        } catch (e) {}

        // Hàm xóa sạch cache và tải lại trực tiếp từ máy chủ
        window.pccmPurgeAndReload = function(clearStorage) {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
              }).catch(function() {});
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) {
                  caches.delete(names[j]);
                }
              }).catch(function() {});
            }
            if (clearStorage) {
              sessionStorage.clear();
            }
          } catch (e) {}
          var currentUrl = new URL(window.location.href);
          currentUrl.searchParams.set('_pccm_v', Date.now());
          window.location.href = currentUrl.toString();
        };

        // 2. Chặn lỗi HMR WebSocket khi dev server tắt HMR theo environment constraints
        var oldOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var str = String(message || '') + String(source || '') + String(error || '');
          if (str.indexOf('send') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1) {
            return true;
          }
          if (!window.__PCCM_MOUNTED__) {
            var btn = document.getElementById('pccm-force-reload-btn');
            if (btn) btn.style.display = 'flex';
            var notice = document.getElementById('pccm-loader-notice');
            if (notice) {
              notice.innerHTML = 'Phát hiện phiên bản mới từ máy chủ. Vui lòng bấm nút bên dưới để tải lại!';
            }
          }
          if (typeof oldOnError === 'function') {
            return oldOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event.reason && (event.reason.message || String(event.reason));
          if (msg && (msg.indexOf('send') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (msg && (msg.indexOf('send') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
          if (!window.__PCCM_MOUNTED__) {
            var btn = document.getElementById('pccm-force-reload-btn');
            if (btn) btn.style.display = 'flex';
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root">
      <!-- Màn hình chờ trực quan ban đầu, chống trắng màn hình khi tải trang (F5) -->
      <div id="initial-app-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1e293b; padding: 24px; text-align: center;">
        <div style="width: 52px; height: 52px; border: 4px solid #1e3a8a; border-top-color: transparent; border-radius: 50%; animation: pccm-spin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 18px; font-weight: 700; color: #1e3a8a; margin: 0 0 8px 0; letter-spacing: -0.01em;">
          PHÂN CÔNG CHUYÊN MÔN
        </h2>
        <p id="pccm-loader-notice" style="font-size: 13px; font-weight: 500; color: #64748b; margin: 0 0 20px 0; max-width: 420px; line-height: 1.6;">
          Đang khởi động hệ thống và nạp dữ liệu trường học...
        </p>
        <div id="pccm-force-reload-btn" style="display: none; gap: 10px; flex-direction: column; align-items: center;">
          <button type="button" onclick="window.pccmPurgeAndReload(false);" style="padding: 10px 22px; background-color: #1e3a8a; color: #ffffff; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);">
            Tải lại phiên bản mới nhất
          </button>
          <button type="button" onclick="window.pccmPurgeAndReload(true);" style="padding: 8px 16px; background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 12px; font-weight: 500; cursor: pointer;">
            Làm mới phiên làm việc
          </button>
        </div>
        <script>
          // Nếu sau 3.5 giây mà React chưa mount vào #root, hiển thị nút làm mới
          setTimeout(function() {
            if (!window.__PCCM_MOUNTED__) {
              var btn = document.getElementById('pccm-force-reload-btn');
              if (btn) btn.style.display = 'flex';
              var notice = document.getElementById('pccm-loader-notice');
              if (notice) {
                notice.innerHTML = 'Hệ thống đang hoàn tất kết nối hoặc cập nhật phiên bản mới.<br/>Quý Thầy/Cô có thể bấm nút bên dưới để tải ngay bản mới nhất!';
              }
            }
          }, 3500);
        </script>
        <style>
          @keyframes pccm-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
